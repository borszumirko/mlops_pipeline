[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "borszumirko", email = "borszumirko@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "torch>=2.4,<3.0",
    "transformers>=4.45,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
mlops-pipeline = "mlops_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
